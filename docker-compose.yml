version: '3.8'
services:
  app:
    build: .
    ports:
      - "8000:8000"  # Si web
    environment:
      - DB_URI=mysql+pymysql://user:pass@db:3306/nom_db
      - OPENAI_API_KEY=votre_cle
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: nom_db
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: